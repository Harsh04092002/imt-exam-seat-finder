<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMT Exam Seat Finder</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #f7f8fa; }
  h1 { font-size: 22px; }
  .search-row { display: flex; gap: 8px; margin: 20px 0; }
  input { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  button { padding: 10px 16px; font-size: 16px; border: none; border-radius: 8px; background: #1e2a5e; color: white; cursor: pointer; }
  .day-label { font-size: 13px; letter-spacing: 1px; color: #555; margin: 24px 0 8px; text-transform: uppercase; }
  .card { background: white; border: 1px solid #e3e3e3; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { background: #eef2ff; border-radius: 8px; padding: 8px 10px; }
  .field .label { font-size: 11px; color: #666; text-transform: uppercase; }
  .field .value { font-weight: 600; }
  #status { color: #900; font-size: 14px; }
</style>
</head>
<body>
  <h1>IMT Exam Seat Finder</h1>
  <div class="search-row">
    <input id="rollInput" placeholder="Enter your roll number" />
    <button onclick="findSeat()">Find my seat</button>
  </div>
  <div id="status"></div>
  <div id="results"></div>

<script>
let allData = {};

// Load the JSON file we generated with Python
fetch("seating_data.json")
  .then(res => res.json())
  .then(data => { allData = data; });

function findSeat() {
  const roll = document.getElementById("rollInput").value.trim();
  const resultsDiv = document.getElementById("results");
  const status = document.getElementById("status");
  resultsDiv.innerHTML = "";
  status.textContent = "";

  const exams = allData[roll];
  if (!exams) {
    status.textContent = "No record found for that roll number.";
    return;
  }

  // Group exams by date so we can show a day label like the original site
  const byDate = {};
  exams.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  Object.keys(byDate).forEach(date => {
    const dayLabel = document.createElement("div");
    dayLabel.className = "day-label";
    dayLabel.textContent = date;
    resultsDiv.appendChild(dayLabel);

    byDate[date].forEach(e => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h3>${e.subject}</h3>
        <div class="grid">
          <div class="field"><div class="label">Date</div><div class="value">${e.date}</div></div>
          <div class="field"><div class="label">Time</div><div class="value">${e.time}</div></div>
          <div class="field"><div class="label">Hall No.</div><div class="value">${e.hall}</div></div>
          <div class="field"><div class="label">Seat No.</div><div class="value">${e.seat}</div></div>
        </div>`;
      resultsDiv.appendChild(card);
    });
  });
}
</script>
</body>
</html>
